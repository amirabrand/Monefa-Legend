<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Messages</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .delete-button {
            background: none;
            border: none;
            color: red;
            font-size: 16px;
            cursor: pointer;
        }
        .message-item {
            cursor: pointer;
        }
    </style>
    <script>
       

        async function loadMessages() {
            const response = await fetch(`ajax.php?cmd=get_messages`);
            const messages = await response.json();
            const messageList = document.getElementById('messageList');
            messageList.innerHTML = '';
            messages.forEach(message => {
                const messageItem = document.createElement('li');
                messageItem.className = 'list-group-item d-flex justify-content-between align-items-center message-item';
                messageItem.innerHTML = `
                    <div onclick="openMessageModal('${message.message.replace(/'/g, "\\'")}')">${message.message}</div>
                    <button class="delete-button" onclick="deleteMessage(${message.id})">✖</button>
                `;
                messageList.appendChild(messageItem);
            });
        }

        async function deleteMessage(messageId) {
            await fetch('ajax.php?cmd=get_messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: new URLSearchParams({
                    'action': 'delete_message',
                    'message_id': messageId
                })
            });
            loadMessages();
            loadMessageCount();
        }

        async function loadMessageCount() {
            const response = await fetch(`ajax.php?cmd=get_messagesnum`);
            const result = await response.json();
            document.getElementById('messageCount').innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" fill="currentColor" class="bi bi-envelope" viewBox="0 0 16 16">
                    <path d="M0 4a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V4z"/>
                    <path d="M.05 4.555L8 9.414l7.95-4.86A1.98 1.98 0 0 0 14 4H2c-.513 0-.995.195-1.387.555zM0 5.697v6.104l5.803-3.48L0 5.697zm6.761 3.374L1.25 12h13.5l-5.511-3.329L8 10.586l-1.239-.74zM16 5.697l-5.803 2.624L16 11.801V5.697z"/>
                </svg> Total Messages: ${result.count}
            `;
        }

        function openMessageModal(messageContent) {
            document.getElementById('messageModalBody').innerHTML = messageContent;
            new bootstrap.Modal(document.getElementById('messageModal')).show();
        }

        window.onload = () => {
            loadMessages();
            loadMessageCount();
        }
    </script>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h3>User Messages</h3>
                <div id="messageCount" class="text-muted">Total Messages: 0</div>
            </div>
            <div class="card-body">
                <ul id="messageList" class="list-group"></ul>
            </div>
        </div>
    </div>

    <!-- Message Modal -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="messageModalLabel">Message</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="messageModalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.min.js"></script>
</body>
</html>
